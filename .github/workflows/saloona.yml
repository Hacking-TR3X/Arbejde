name: Saloona

# Saloona's own pipeline. It does not touch LoopCast (build.yml) and never
# takes over its "latest" release: the Saloona test release is a prerelease
# that is never marked latest.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment).
# Update them deliberately, checking the new commit.

on:
  push:
    branches: ["**"]
    paths:
      - "saloona/**"
      - ".github/workflows/saloona.yml"
  workflow_dispatch:

# Least privilege: only the publish job gets write access.
permissions:
  contents: read

concurrency:
  group: saloona-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: saloona

jobs:
  web:
    name: Web (check, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: saloona/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build

  android:
    name: Android (test build + unsigned release)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: saloona/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          validate-wrappers: true

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # A stable test key, so each new test APK installs over the previous one.
      # It signs only "Saloona test" (dk.saloona.app.test), never the real app.
      - name: Point the Android tools at ~/.android
        run: echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"

      - name: Restore test keystore
        id: debug-keystore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.android/debug.keystore
          key: saloona-debug-keystore-v1

      - name: Create test keystore
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APKs
        working-directory: saloona/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PversionCode=${{ github.run_number }} assembleDebug assembleTester assembleRelease

      - name: Collect APKs
        working-directory: saloona/android/app/build/outputs
        run: |
          mkdir -p "$RUNNER_TEMP/apk-test" "$RUNNER_TEMP/apk-release"
          cp apk/tester/app-tester.apk "$RUNNER_TEMP/apk-test/Saloona-test.apk"
          cp apk/release/*.apk "$RUNNER_TEMP/apk-release/"
          if [ -f mapping/release/mapping.txt ]; then
            cp mapping/release/mapping.txt "$RUNNER_TEMP/apk-release/"
          fi
          ls -l "$RUNNER_TEMP/apk-test" "$RUNNER_TEMP/apk-release"

      # The merged manifest must only contain the permissions and exported
      # components documented in SECURITY.md.
      - name: Check merged manifest (permissions, exported components)
        run: |
          python3 scripts/ci-manifest-check.py "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            "$RUNNER_TEMP/apk-test/Saloona-test.apk" \
            "$(ls "$RUNNER_TEMP"/apk-release/*.apk | head -n 1)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saloona-test-apk
          path: ${{ runner.temp }}/apk-test/Saloona-test.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saloona-release-unsigned-apk
          path: ${{ runner.temp }}/apk-release/
          if-no-files-found: error

  smoke:
    name: Smoke test on emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: saloona-test-apk
          path: ${{ runner.temp }}/apk/test

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: saloona-release-unsigned-apk
          path: ${{ runner.temp }}/apk/release

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "build-tools;36.0.0 platform-tools"

      # The unsigned release is launched too, signed here with a key generated for
      # this run only; neither the key nor the signed APK is uploaded.
      - name: Sign release APK with a throw-away key
        run: |
          set -euo pipefail
          SMOKE_KS_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$SMOKE_KS_PASS"
          export SMOKE_KS_PASS
          KS="$RUNNER_TEMP/smoke-only.jks"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$(ls "$RUNNER_TEMP"/apk/release/*.apk | head -n 1)"
          keytool -genkeypair -noprompt -keystore "$KS" \
            -storepass "$SMOKE_KS_PASS" -keypass "$SMOKE_KS_PASS" \
            -alias smoke -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Saloona CI smoke test"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias smoke \
            --ks-pass env:SMOKE_KS_PASS --key-pass env:SMOKE_KS_PASS \
            --out "$RUNNER_TEMP/apk/Saloona-release-smoke.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$KS" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/apk/Saloona-release-smoke.apk"

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APKs on emulator
        env:
          SMOKE_EXPECT_TEXT: Din kundebog
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: saloona
          script: bash scripts/ci-smoke.sh "${{ runner.temp }}/smoke" "${{ runner.temp }}/apk/test/Saloona-test.apk:dk.saloona.app.test:test" "${{ runner.temp }}/apk/Saloona-release-smoke.apk:dk.saloona.app:release"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: saloona-smoke
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: warn

  publish:
    name: Publish test release
    needs: smoke
    if: github.ref == 'refs/heads/claude/saloona-salon-app-cxdxja'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: saloona-test-apk
          path: ${{ runner.temp }}/publish

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: saloona-smoke
          path: ${{ runner.temp }}/smoke

      - name: Move "saloona-test" tag to this commit
        run: |
          git tag -f saloona-test "$GITHUB_SHA"
          git push -f origin refs/tags/saloona-test

      # Stable link: https://github.com/<owner>/<repo>/releases/download/saloona-test/Saloona-test.apk
      # Uses the preinstalled GitHub CLI instead of a third-party action.
      - name: Publish test release
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<EOF
          Automatisk testversion af Saloona fra commit ${GITHUB_SHA}.

          **Testversionen er bygget som den rigtige app** (krypteret database, ingen fejlfinding, ingen internetadgang), men den er signeret med en testnøgle og installeres som en separat app, **Saloona test**. Den rigtige Saloona bygger og signerer du selv (se README).

          **Sådan installerer du den**
          1. Åbn denne side på telefonen, og tryk på \`Saloona-test.apk\` under "Assets".
          2. Når Android spørger, så tillad, at browseren (eller Filer) må installere ukendte apps.
          3. Tryk "Installer", og åbn **Saloona test**.

          **Tag backup** (Mere → Backup) før du installerer en ny testversion. Normalt installeres den oven på den forrige, og dine data bliver liggende. Hvis Android siger, at pakken er i konflikt med en eksisterende pakke, er testnøglen skiftet. Så skal "Saloona test" afinstalleres først, og data hentes tilbage fra din backup.

          \`saloona-smoke-test.png\` og \`saloona-smoke-release.png\` er skærmbilleder fra den automatiske test på en emulator (Android 14).
          EOF
          sed -i 's/^          //' "$NOTES"
          if gh release view saloona-test >/dev/null 2>&1; then
            gh release edit saloona-test --title "Saloona – testversion" --notes-file "$NOTES" --prerelease --latest=false
          else
            gh release create saloona-test --verify-tag --title "Saloona – testversion" --notes-file "$NOTES" --prerelease --latest=false
          fi
          gh release upload saloona-test --clobber \
            "$RUNNER_TEMP/publish/Saloona-test.apk" \
            "$RUNNER_TEMP/smoke/saloona-smoke-test.png" \
            "$RUNNER_TEMP/smoke/saloona-smoke-release.png"
          # Remove the old debug-signed asset names if they are still attached.
          gh release delete-asset saloona-test saloona-smoke-debug.png --yes 2>/dev/null || true
