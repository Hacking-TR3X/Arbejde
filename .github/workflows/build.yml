name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LoopCast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LoopCast-apk
          path: LoopCast.apk

      # Publish a stable download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/LoopCast.apk
      - name: Move "latest" tag to this commit
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/soundcloud-loop-cast-app-6u8svk'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/soundcloud-loop-cast-app-6u8svk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LoopCast – nyeste build
          body: |
            Nyeste automatiske build af LoopCast (commit ${{ github.sha }}).

            Download `LoopCast.apk` herunder og installér den på din Android-telefon.
          files: LoopCast.apk
          make_latest: true
