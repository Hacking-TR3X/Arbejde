name: Build APKs

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test Spøgelsesjæger
        run: ./gradlew --no-daemon :spoegelsesjaeger:testDebugUnitTest

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk LoopCast.apk
          cp spoegelsesjaeger/build/outputs/apk/release/spoegelsesjaeger-release.apk Spoegelsesjaeger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LoopCast-apk
          path: LoopCast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Spoegelsesjaeger-apk
          path: Spoegelsesjaeger.apk

      # Publish a stable download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/LoopCast.apk
      - name: Move "latest" tag to this commit
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/soundcloud-loop-cast-app-6u8svk'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/soundcloud-loop-cast-app-6u8svk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LoopCast – nyeste build
          body: |
            Nyeste automatiske build af LoopCast (commit ${{ github.sha }}).

            Download `LoopCast.apk` herunder og installér den på din Android-telefon.
          files: LoopCast.apk
          make_latest: true

      # Spøgelsesjæger gets its own release, so LoopCast keeps the "latest" link above:
      # https://github.com/<owner>/<repo>/releases/download/spoegelsesjaeger-latest/Spoegelsesjaeger.apk
      - name: Move "spoegelsesjaeger-latest" tag to this commit
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-8bb97746-1diyxi'
        run: |
          git tag -f spoegelsesjaeger-latest
          git push -f origin spoegelsesjaeger-latest

      - name: Publish Spøgelsesjæger release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-8bb97746-1diyxi'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spoegelsesjaeger-latest
          name: Spøgelsesjæger – nyeste build
          body: |
            Nyeste automatiske build af Spøgelsesjæger (commit ${{ github.sha }}).

            Download `Spoegelsesjaeger.apk` herunder og installér den på din Android-telefon.
          files: Spoegelsesjaeger.apk
          make_latest: false
